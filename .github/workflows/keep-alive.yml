name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Khamosh Alfaaz Render Backend at $(date)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 3 "https://khamosh-alfaaz-server.onrender.com/api/health" || true)
          echo "HTTP Status Code: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Backend is warm and healthy."
          else
            echo "Backend returned $STATUS (waking up or network delay)."
          fi
